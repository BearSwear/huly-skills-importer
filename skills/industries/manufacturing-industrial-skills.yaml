- name: Quality Management Systems
  category: Management
  description: Operate documented quality processes, responsibilities, records, audits and improvement mechanisms.
- name: ISO 9001
  category: Hard Skills
  description: Apply ISO 9001 quality-management requirements to organizational processes and evidence.
- name: Supplier Quality Management
  category: Management
  description: Qualify, monitor and improve supplier quality, capability and corrective-action performance.
- name: PPAP
  category: Quality Assurance
  description: Prepare production part approval evidence demonstrating manufacturing readiness and process control.
- name: APQP
  category: Management
  description: Plan product and process quality activities from development through production launch.

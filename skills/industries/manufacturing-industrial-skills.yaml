skills:
- name: Manufacturing Engineering
  category: Hard Skills
  description: Design, improve and sustain manufacturing processes, equipment, layouts and production systems.
- name: Industrial Engineering
  category: Hard Skills
  description: Optimize processes, resources, flow, ergonomics, capacity and productivity across industrial operations.
- name: Process Engineering
  category: Hard Skills
  description: Design, control and improve industrial processes using material, energy, quality and safety requirements.
- name: Production Engineering
  category: Hard Skills
  description: Support production readiness, process capability, tooling, work instructions and operational problem
    solving.
- name: Design for Manufacturability
  category: Hard Skills
  description: Evaluate product designs for efficient, reliable and cost-effective manufacturing.
- name: Lean Manufacturing
  category: Hard Skills
  description: Eliminate waste and improve flow, quality and responsiveness using Lean principles.
- name: Six Sigma
  category: Hard Skills
  description: Reduce variation and defects using statistical, structured improvement methods.
- name: DMAIC
  category: Hard Skills
  description: Apply Define, Measure, Analyze, Improve and Control to process-improvement problems.
- name: 5S
  category: Hard Skills
  description: Organize workplaces for visual control, cleanliness, safety and repeatable efficient work.
- name: Value Stream Mapping
  category: Business Analytics
  description: Visualize material and information flow to identify delays, waste and improvement opportunities.
- name: Kaizen
  category: Management
  description: Facilitate incremental continuous improvement involving frontline teams and measurable follow-through.
- name: SMED
  category: Hard Skills
  description: Reduce equipment setup and changeover time through systematic separation and simplification of activities.
- name: Overall Equipment Effectiveness
  category: Business Analytics
  description: Measure availability, performance and quality losses to improve production equipment effectiveness.
- name: Statistical Process Control
  category: Quality Assurance
  description: Monitor process variation with control charts and react appropriately to special causes.
- name: Process Capability Analysis
  category: Quality Assurance
  description: Evaluate whether stable processes can consistently meet specification requirements.
- name: Root Cause Analysis
  category: Quality Assurance
  description: Identify underlying causes of failures or defects and validate corrective actions.
- name: 5 Whys
  category: Quality Assurance
  description: Use iterative questioning to identify underlying causes behind operational problems.
- name: Fishbone Analysis
  category: Quality Assurance
  description: Structure potential causes across people, methods, machines, materials and environment.

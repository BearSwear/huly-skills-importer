# Community-maintained example catalogue for huly-skills-importer.
# Research-informed, not an official taxonomy or certification standard.
# Research basis: OECD digital-government policy and public-sector skills work; ISO 18091 local-government quality guidance; public procurement, service design, policy and administrative practice.
# Edit this catalogue to match your organization, jurisdiction and recruiting needs.

version: 1

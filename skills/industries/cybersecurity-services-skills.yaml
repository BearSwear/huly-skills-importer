skills:
- name: Security Architecture
  category: Hard Skills
  description: Design security controls, trust boundaries and defense-in-depth architectures across systems and
    services.
- name: Security Engineering
  category: Hard Skills
  description: Implement and operate technical security controls across applications, endpoints, networks and cloud
    platforms.
- name: Security Operations / SOC
  category: Hard Skills
  description: Operate security monitoring, triage, escalation and incident-handling workflows in a security operations
    center.
- name: Incident Response
  category: Hard Skills
  description: Prepare for, contain, eradicate and recover from cybersecurity incidents using documented response
    procedures.
- name: Digital Forensics
  category: Hard Skills
  description: Acquire, preserve and analyze digital evidence from endpoints, servers, cloud services and other
    systems.
- name: Forensic Readiness
  category: Hard Skills
  description: Design logging, retention and evidence-handling practices so investigations can be performed effectively.
- name: Threat Hunting
  category: Hard Skills
  description: Form hypotheses and proactively search telemetry for adversary activity that evades existing detections.
- name: Threat Intelligence
  category: Hard Skills
  description: Collect, analyze and operationalize information about threat actors, campaigns, infrastructure and
    tactics.
- name: Detection Engineering
  category: Hard Skills
  description: Develop, test, tune and maintain detections mapped to adversary behavior and available telemetry.
- name: SIEM
  category: Hard Skills
  description: Design and operate centralized security event collection, correlation, alerting and investigation
    workflows.
- name: SOAR
  category: Hard Skills
  description: Automate repeatable security operations workflows, enrichment, response actions and case handling.
- name: EDR / XDR
  category: Hard Skills
  description: Deploy and operate endpoint or cross-domain detection and response platforms.
- name: Log Analysis
  category: Hard Skills
  description: Interpret security-relevant logs to identify anomalies, attack evidence and root causes.
- name: Security Monitoring
  category: Hard Skills
  description: Continuously monitor systems and services for security events, suspicious behavior and control failures.
- name: File Integrity Monitoring
  category: Hard Skills
  description: Monitor sensitive files and configurations for unauthorized or unexpected change.
- name: Vulnerability Management
  category: Hard Skills
  description: Discover, prioritize, remediate and verify vulnerabilities across infrastructure and applications.
- name: Vulnerability Assessment
  category: Hard Skills
  description: Assess systems for security weaknesses using scanning, configuration review and manual validation.
- name: Penetration Testing
  category: Hard Skills
  description: Conduct authorized security testing to identify exploitable weaknesses and demonstrate impact.
- name: Red Teaming
  category: Hard Skills
  description: Emulate realistic adversaries to assess preventive, detective and response capabilities.
- name: Purple Teaming
  category: Hard Skills
  description: Coordinate offensive and defensive teams to validate and improve detections and controls.
- name: Ethical Hacking
  category: Hard Skills
  description: Apply offensive security techniques within authorized scopes to identify and demonstrate weaknesses.
- name: Web Application Security
  category: Hard Skills
  description: Assess and secure web applications against common design, implementation and configuration flaws.

- name: Executive Communication
  category: Soft Skills
  description: Communicate complex findings, implications and recommendations concisely to senior decision makers.
- name: Problem Solving
  category: Soft Skills
  description: Approach ambiguous problems systematically, combining logic, evidence, creativity and pragmatism.
- name: Critical Thinking
  category: Soft Skills
  description: Evaluate assumptions, evidence, causal claims and alternatives before accepting conclusions.
- name: Strategic Thinking
  category: Soft Skills

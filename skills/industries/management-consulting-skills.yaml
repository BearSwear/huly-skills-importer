- name: Decision Management
  category: Management
  description: Structure significant decisions, options, criteria, evidence, owners and follow-up.
- name: Workshop Design
  category: Soft Skills
  description: Design collaborative sessions with clear objectives, activities, outputs and participant roles.
- name: Workshop Facilitation
  category: Soft Skills
  description: Guide groups through structured discussion, analysis and decision making.
- name: Stakeholder Management
  category: Soft Skills
  description: Build alignment and maintain effective relationships across client sponsors, teams and partners.
- name: Consultative Selling
  category: Sales

  category: Business Analytics
  description: Assess how proposed changes affect roles, processes, skills, systems and stakeholders.
- name: Organizational Readiness Assessment
  category: Business Analytics
  description: Evaluate whether leadership, capability, capacity and culture are ready for planned change.
- name: Benefits Management
  category: Management
  description: Define, track and realize measurable benefits from projects, programmes and transformations.
- name: Programme Management
  category: Management
  description: Coordinate related projects, dependencies, governance and benefits toward strategic outcomes.
- name: Project Management
  category: Management
  description: Manage scope, schedule, cost, quality, risk, stakeholders and delivery outcomes.
- name: Portfolio Management
  category: Management
  description: Prioritize and govern investments against strategy, capacity, risk and expected value.
- name: PMO Design and Operations
  category: Management
  description: Establish portfolio standards, reporting, governance, methods and delivery support.
- name: Agile Delivery
  category: Management
  description: Use iterative planning, prioritization and feedback to deliver value under changing conditions.
- name: Hybrid Project Delivery
  category: Management

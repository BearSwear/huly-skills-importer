- name: Python
  category: Programming Languages
  description: Use Python for data analysis, automation, modeling and repeatable consulting workflows.
- name: AI-Assisted Research
  category: Hard Skills
  description: Use AI tools to accelerate research while validating sources, claims and relevance.

skills:
- name: Management Consulting
  category: Hard Skills
  description: Structure and deliver advisory engagements that create practical, evidence-based value for clients.
- name: ISO 20700
  category: Hard Skills
  description: Apply ISO 20700 guidance to transparent and effective management-consultancy service delivery.
- name: Consulting Engagement Design
  category: Management
  description: Define engagement objectives, scope, approach, governance, deliverables and client responsibilities.
- name: Problem Structuring
  category: Business Analytics
  description: Break ambiguous business problems into testable questions, workstreams and decision-relevant analyses.
- name: Hypothesis-Driven Problem Solving
  category: Business Analytics
  description: Form hypotheses early and focus analysis on evidence needed to confirm, refine or reject them.
- name: Strategy Development
  category: Management
  description: Develop coherent choices about markets, capabilities, priorities and resource allocation.
- name: Corporate Strategy
  category: Management
  description: Advise on portfolio, growth, capital allocation and enterprise-level strategic direction.
- name: Business Unit Strategy
  category: Management
  description: Develop competitive direction and operating priorities for a defined business or service area.
- name: Operating Model Design
  category: Management
  description: Define organizational capabilities, processes, governance, technology and roles needed to execute
    strategy.
- name: Business Model Design
  category: Business Analytics
  description: Analyze and design value propositions, customers, channels, economics and operating mechanisms.
- name: Market Analysis
  category: Business Analytics
  description: Assess market size, structure, trends, demand, regulation and strategic attractiveness.
- name: Competitive Analysis
  category: Business Analytics
  description: Evaluate competitor positions, capabilities, economics and likely responses to strategic moves.
- name: Customer Analysis
  category: Business Analytics
  description: Analyze customer needs, behavior, segmentation and value drivers to support strategic decisions.
- name: Benchmarking
  category: Business Analytics
  description: Compare performance, practices or capabilities against peers and relevant reference groups.
- name: Financial Analysis
  category: Business Analytics
  description: Analyze revenue, cost, profitability, cash and financial drivers supporting client decisions.

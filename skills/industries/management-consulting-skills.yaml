- name: Collaboration
  category: Soft Skills
  description: Work effectively across disciplines, client teams and organizational boundaries.
- name: Team Leadership
  category: Soft Skills
  description: Set direction, coach team members, manage quality and create an effective delivery environment.
- name: Negotiation
  category: Soft Skills

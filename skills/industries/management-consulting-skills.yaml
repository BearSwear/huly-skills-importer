- name: Process Mapping
  category: Business Analytics
  description: Document current and future process flows, actors, decisions, information and systems.
- name: Business Process Improvement
  category: Management
  description: Redesign processes to improve quality, speed, cost, control and customer outcomes.
- name: Business Analysis
  category: Hard Skills
  description: Apply structured analysis to understand needs, define change and evaluate solutions.
- name: Business Analysis Planning
  category: Management
  description: Plan business-analysis activities, stakeholders, governance, information and deliverables.
- name: Requirements Elicitation
  category: Soft Skills
  description: Gather needs and constraints through interviews, workshops, observation and document analysis.
- name: Requirements Management
  category: Management
  description: Trace, prioritize, maintain and govern requirements and design information through change.
- name: Strategy Analysis
  category: Business Analytics
  description: Assess current state, future state, risks and change strategy according to organizational objectives.
- name: Solution Evaluation
  category: Business Analytics
  description: Assess delivered solutions against intended value, requirements and observed performance.
- name: Stakeholder Analysis
  category: Business Analytics
  description: Identify stakeholders, interests, influence, concerns and engagement needs.

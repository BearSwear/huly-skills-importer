- name: Data Analysis
  category: Business Analytics
  description: Clean, analyze and interpret quantitative data to answer client questions and support recommendations.
- name: Data Visualization
  category: Business Analytics
  description: Present analytical findings using clear visual forms suited to the decision being made.
- name: KPI Design
  category: Business Analytics
  description: Define measures that reflect strategic objectives, operational performance and decision needs.
- name: Performance Management
  category: Management
  description: Establish goals, measures, review routines and interventions to improve organizational results.
- name: Process Analysis
  category: Business Analytics

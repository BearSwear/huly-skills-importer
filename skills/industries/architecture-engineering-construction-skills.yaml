skills:
- name: Architectural Design
  category: Design
  description: Develop building concepts, spatial arrangements, form, materiality and design solutions from brief through
    delivery.
- name: Interior Design
  category: Design
  description: Design interior environments, finishes, layouts, furniture and user experience to meet functional and aesthetic
    needs.
- name: Landscape Architecture
  category: Design
  description: Design external spaces, landscapes, public realm and site interfaces with ecological and user considerations.
- name: Urban Design
  category: Design
  description: Shape streets, neighborhoods and public spaces through integrated spatial, mobility and place-making design.
- name: Design Development
  category: Design
  description: Develop approved concepts into coordinated, buildable and documented design solutions.
- name: Technical Drawing
  category: Design
  description: Produce clear technical drawings, details and graphical information for design and construction.
- name: Building Information Modeling
  category: Hard Skills
  description: Create and manage structured digital building models for multidisciplinary design, delivery and operation.
- name: BIM Coordination
  category: Hard Skills
  description: Coordinate multidisciplinary models, interfaces, issues and agreed model-development processes.
- name: BIM Management
  category: Management
  description: Establish BIM execution approaches, responsibilities, standards, model delivery and quality processes.
- name: Information Management / ISO 19650
  category: Management
  description: Manage project information requirements, containers, status, approval and delivery using ISO 19650 principles.
- name: OpenBIM
  category: Hard Skills
  description: Use vendor-neutral open standards and workflows for built-asset information exchange and collaboration.

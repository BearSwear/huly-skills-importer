- name: Archicad
  category: Hard Skills
  description: Develop architectural BIM models, documentation and collaborative workflows using Archicad.
- name: Rhino
  category: Design
  description: Develop complex geometry and design studies using Rhino.
- name: Grasshopper
  category: Design
  description: Create parametric and computational design workflows using Grasshopper.
- name: Dynamo
  category: Hard Skills

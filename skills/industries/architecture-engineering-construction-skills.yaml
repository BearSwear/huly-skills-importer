- name: Rail Design
  category: Hard Skills
  description: Design and coordinate rail alignment, track, interfaces and supporting infrastructure.
- name: Bridge Engineering
  category: Hard Skills
  description: Analyze, design, inspect and rehabilitate bridge structures and components.

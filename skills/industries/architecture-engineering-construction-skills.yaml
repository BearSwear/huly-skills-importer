- name: AutoCAD
  category: Desktop Application Development
  description: Create and edit 2D and 3D technical drawings using AutoCAD.
- name: Civil 3D
  category: Hard Skills
  description: Design and document civil infrastructure, surfaces, alignments, corridors and pipe networks.
- name: Tekla Structures
  category: Hard Skills
  description: Model and detail structural steel and concrete systems using Tekla Structures.
- name: Navisworks
  category: Hard Skills
